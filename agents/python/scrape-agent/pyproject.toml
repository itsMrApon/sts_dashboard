[project]
name = "sts-scrape-agent"
version = "0.1.0"
description = "ScrapeGraphAI worker for STS lead website enrichment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "scrapegraphai>=1.5.0",
    "langchain-google-genai>=2.0.0",
    "playwright>=1.40.0",
]

[project.scripts]
scrape-agent = "agent.main:run"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
